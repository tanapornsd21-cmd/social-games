<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>快乐家庭 — ครอบครัวแสนสุข</title>
<style>
:root{box-sizing:border-box;--bg:#fff3e0;--card:#fff;--ink:#4e2a1e;--pink:#ff6fa5;--pink2:#e0457f;--gold:#ffc83d;--mint:#43c59e;--red:#e5484d;--sky:#8fd3ff;--shadow:#e0b88a;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#2b1a24;--card:#4a2c3d;--ink:#ffeede;--shadow:#1a0e15;--sky:#2c4a7a}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sarabun","Noto Sans Thai",system-ui,sans-serif;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:12px}
.hud{display:flex;justify-content:space-between;align-items:center;gap:6px;font-weight:700;margin-bottom:8px}
.pill{background:var(--card);border-radius:20px;padding:4px 12px;box-shadow:0 3px 0 var(--shadow);white-space:nowrap}
.btn{font:inherit;font-weight:800;font-size:1.1rem;border:0;border-radius:18px;padding:12px 20px;background:var(--pink);color:#fff;box-shadow:0 5px 0 var(--pink2);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--pink2)}
.btn.big{font-size:1.5rem;padding:16px 36px}
.btn.alt{background:var(--mint);box-shadow:0 5px 0 #2a9a79}
.btn.gold{background:var(--gold);color:#5a3b00;box-shadow:0 5px 0 #c89a14}
h1,h2{text-align:center;margin:6px 0}
.hero{text-align:center;padding:14px;border-radius:24px;background:linear-gradient(var(--sky),#ffe0f0);box-shadow:0 5px 0 var(--shadow)}
.castle{font-size:3.2rem;letter-spacing:4px}
.hop{display:inline-block;animation:hop 1s ease-in-out infinite;font-size:4rem}
@keyframes hop{50%{transform:translateY(-22px)}}
.map{display:grid;gap:10px;margin:14px 0}
.stage{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:12px;box-shadow:0 4px 0 var(--shadow);cursor:pointer;border:3px solid transparent}
.stage.lock{opacity:.55;filter:grayscale(.8);cursor:not-allowed}
.stage b{font-size:1.1rem}.stage small{display:block;opacity:.8}
.stage .ic{font-size:2.2rem}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ck{background:var(--card);border-radius:22px;padding:14px 8px;text-align:center;box-shadow:0 5px 0 var(--shadow);cursor:pointer;min-height:130px;border:3px dashed var(--gold)}
.ck .zh{font-size:2.4rem;font-weight:800}.ck .py{color:var(--pink2);font-weight:700}
.ck .th{display:none;font-size:1.2rem;margin-top:4px}.ck.open .th{display:block}
.run{position:relative;height:110px;border-radius:18px;overflow:hidden;background:linear-gradient(var(--sky) 60%,#bfe8a0 60%);box-shadow:0 4px 0 var(--shadow);margin-bottom:8px}
.hills{position:absolute;bottom:26px;left:0;right:0;height:40px;background:radial-gradient(60px 40px at 30px 40px,#7ccf6b 98%,transparent) 0 0/120px 40px repeat-x;animation:scroll 6s linear infinite}
.ground{position:absolute;bottom:0;left:0;right:0;height:26px;background:repeating-linear-gradient(90deg,#c98b4a 0 30px,#b97a3b 30px 60px);animation:scroll 1.5s linear infinite}
@keyframes scroll{to{background-position-x:-120px}}
.ground{animation-name:scrollg}@keyframes scrollg{to{background-position-x:-60px}}
.cloud{position:absolute;top:8px;font-size:1.6rem;animation:cl 14s linear infinite}
@keyframes cl{from{left:100%}to{left:-10%}}
.hero-c{position:absolute;left:36px;bottom:24px;font-size:2.4rem;transition:bottom .25s}
.hero-c.jump{bottom:62px}
.star{position:absolute;bottom:50px;font-size:1.7rem;left:100%;animation:fly 4s linear forwards}
@keyframes fly{to{left:-10%}}
.paused .star,.paused .hills,.paused .ground,.paused .cloud{animation-play-state:paused}
.q{background:var(--card);border-radius:22px;padding:14px;text-align:center;box-shadow:0 5px 0 var(--shadow)}
.q .zh{font-size:3.4rem;font-weight:800;line-height:1.1}.q .py{font-size:2rem;font-weight:800;color:var(--pink2)}
.bar{height:12px;border-radius:8px;background:var(--shadow);overflow:hidden;margin:8px 0}
.bar i{display:block;height:100%;background:var(--mint);transition:width .3s}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.opt{font:inherit;font-size:1.2rem;font-weight:800;min-height:64px;border:0;border-radius:18px;background:var(--card);color:var(--ink);box-shadow:0 5px 0 var(--shadow);cursor:pointer}
.opt.ok{background:var(--mint);color:#fff}.opt.no{background:var(--red);color:#fff}
.stars{font-size:3rem;text-align:center}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:var(--gold);color:#5a3b00;padding:8px 18px;border-radius:20px;font-weight:800;z-index:9;box-shadow:0 3px 0 #c89a14}
.pit{position:absolute;bottom:0;left:100%;width:42px;height:26px;background:#2b1408;border-radius:14px 14px 0 0;box-shadow:inset 0 6px 0 #000;z-index:2;animation:fly 4s linear forwards}
.paused .pit{animation-play-state:paused}
.hero-c.fall{bottom:-34px;transform:rotate(80deg)}
.hero-c svg,.hop svg{display:block}
.btn:disabled{opacity:.5;filter:grayscale(.6)}
#nm{font:inherit;font-size:1.2rem;font-weight:700;text-align:center;padding:10px;border-radius:16px;border:3px solid var(--gold);background:var(--card);color:var(--ink);width:80%;max-width:300px;margin:6px 0 12px}
</style></head>
<body><div id="app"></div>
<script>
const W=[["家庭","Jiātíng","ครอบครัว"],["爸爸","Bàba","พ่อ"],["妈妈","Māma","แม่"],["爷爷","Yéye","ปู่"],["奶奶","Nǎinai","ย่า"],["外公","Wàigōng","ตา"],["外婆","Wàipó","ยาย"],["哥哥","Gēge","พี่ชาย"],["弟弟","Dìdi","น้องชาย"],["姐姐","Jiějie","พี่สาว"],["妹妹","Mèimei","น้องสาว"],["家人","Jiārén","สมาชิกในครอบครัว"]];
const ST=[{ic:"🍓",name:"ด่าน 1: หมู่บ้านครอบครัว",d:"ทายคำศัพท์ 10 ข้อ (ข้อละ 10 คะแนน)",n:10,pts:10,type:"zh",need:7},
{ic:"🌳",name:"ด่าน 2: ป่าดาวหวาน",d:"จับคู่พินอิน 8 ข้อ (ข้อละ 5 คะแนน)",n:8,pts:5,type:"py",need:5},
{ic:"🏰",name:"ด่าน 3: ปราสาทน้ำตาล",d:"ด่านผสม 8 ข้อ (ข้อละ 10 คะแนน)",n:8,pts:10,type:"mix",need:99}];
let S={coins:0,unlocked:1};
try{const s=JSON.parse(localStorage.getItem("fam")||"null");if(s)S=s}catch(e){}
const save=()=>{try{localStorage.setItem("fam",JSON.stringify(S))}catch(e){}};
const $=s=>document.querySelector(s),app=$("#app");
const shuf=a=>[...a].sort(()=>Math.random()-.5);
let G=null,timers=[];
const clr=()=>{timers.forEach(clearInterval);timers=[]};
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),1100)}
function say(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="zh-CN";u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
const hud=()=>`<div class="hud"><span class="pill">🪙 ${S.coins}</span><span class="pill" style="display:flex;align-items:center;gap:6px">${CH(22)} ${esc(S.name)||"ถังถัง 糖糖"}</span></div>`;

const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CH0=z=>`<svg viewBox="0 0 64 64" width="${z}" height="${z}"><circle cx="32" cy="36" r="24" fill="#ffb347" stroke="#a8541a" stroke-width="3"/><circle cx="20" cy="26" r="3" fill="#a8541a" opacity=".35"/><circle cx="43" cy="46" r="3" fill="#a8541a" opacity=".35"/><ellipse cx="22" cy="39" rx="5" ry="3.5" fill="#ff8fb3"/><ellipse cx="42" cy="39" rx="5" ry="3.5" fill="#ff8fb3"/><circle cx="24" cy="32" r="3.2" fill="#3a1a0a"/><circle cx="40" cy="32" r="3.2" fill="#3a1a0a"/><path d="M26 41q6 6 12 0" fill="none" stroke="#3a1a0a" stroke-width="2.6" stroke-linecap="round"/><path d="M24 14q8-10 16 0z" fill="#ff4d8d" stroke="#c2255c" stroke-width="2"/><circle cx="32" cy="8" r="4" fill="#ffe066" stroke="#c89a14" stroke-width="2"/></svg>`;
function CH(z){const c=S.cos||{body:"#ffb347",hat:1,acc:0};
const H=["",'<path d="M24 14q8-10 16 0z" fill="#ff4d8d" stroke="#c2255c" stroke-width="2"/><circle cx="32" cy="8" r="4" fill="#ffe066" stroke="#c89a14" stroke-width="2"/>','<path d="M20 15l2-11 6 6 4-8 4 8 6-6 2 11z" fill="#ffd43b" stroke="#c89a14" stroke-width="2"/>','<path d="M25 15l7-14 7 14z" fill="#4dabf7" stroke="#1c7ed6" stroke-width="2"/><circle cx="32" cy="2" r="3" fill="#ff6b6b"/>','<g fill="#ff8fb3"><circle cx="27" cy="10" r="3.5"/><circle cx="37" cy="10" r="3.5"/><circle cx="32" cy="5" r="3.5"/><circle cx="32" cy="14" r="3.5"/></g><circle cx="32" cy="10" r="3" fill="#ffe066"/>'];
const A=["",'<g fill="none" stroke="#333" stroke-width="2"><circle cx="24" cy="32" r="6"/><circle cx="40" cy="32" r="6"/><path d="M30 32h4"/></g>','<path d="M12 50q20 10 40 0l-2 7q-18 8-36 0z" fill="#e5484d"/>','<path d="M32 55l-9-6v12zM32 55l9-6v12z" fill="#845ef7"/>'];
return `<svg viewBox="0 0 64 64" width="${z}" height="${z}"><circle cx="32" cy="36" r="24" fill="${c.body}" stroke="#7a3d12" stroke-width="3"/><circle cx="20" cy="26" r="3" fill="#7a3d12" opacity=".3"/><circle cx="43" cy="46" r="3" fill="#7a3d12" opacity=".3"/><ellipse cx="22" cy="40" rx="5" ry="3.5" fill="#ff8fb3"/><ellipse cx="42" cy="40" rx="5" ry="3.5" fill="#ff8fb3"/><circle cx="24" cy="32" r="3.2" fill="#3a1a0a"/><circle cx="40" cy="32" r="3.2" fill="#3a1a0a"/><path d="M26 42q6 6 12 0" fill="none" stroke="#3a1a0a" stroke-width="2.6" stroke-linecap="round"/>${A[c.acc]||""}${H[c.hat]||""}</svg>`}
function dress(){clr();S.cos=S.cos||{body:"#ffb347",hat:1,acc:0};const C=S.cos;
const cols=["#ffb347","#ff8fb3","#8fd3ff","#a9e34b","#d0bfff","#ffd43b"],hats=["ไม่ใส่","ริบบิ้น","มงกุฏ","หมวกปาร์ตี้","ดอกไม้"],accs=["ไม่มี","แว่น","ผ้าพันคอ","โบว์"];
const sec=(t,k,arr,sw)=>`<h3 style="margin:10px 0 4px;text-align:center">${t}</h3><div class="row" style="margin:0">${arr.map((v,i)=>{const val=sw?v:i;const on=C[k]==val;return `<button class="opt dr" data-k="${k}" data-v="${val}" style="min-height:48px;padding:4px 12px;${sw?`background:${v};width:48px;`:""}${on?"outline:4px solid var(--pink2)":""}">${sw?"":v}</button>`}).join("")}</div>`;
app.innerHTML=hud()+`<h2>👗 แต่งตัวละคร</h2><div class="hero"><div class="hop">${CH(110)}</div></div>`+sec("สีตัว","body",cols,1)+sec("หมวก","hat",hats)+sec("เครื่องประดับ","acc",accs)+`<div class="row"><button class="btn alt" id="hm">🏰 กลับอาณาจักร</button></div>`;
app.querySelectorAll(".dr").forEach(b=>b.onclick=()=>{const v=b.dataset.v;C[b.dataset.k]=b.dataset.k=="body"?v:+v;save();dress()});
$("#hm").onclick=home}
function home(){clr();
app.innerHTML=hud()+`<div class="hero"><div class="castle">🏰🍭🧁</div><div class="hop">${CH(90)}</div><h1>快乐家庭<br>ครอบครัวแสนสุข</h1><p>ร่วมผจญภัยกับน้องคุกกี้ถังถัง เรียนคำศัพท์ภาษาจีนเรื่องครอบครัว!</p><div><input id="nm" maxlength="20" placeholder="✏️ พิมพ์ชื่อของนักเรียน" value="${esc(S.name)}"></div><div class="row"><button class="btn big" id="go">⭐ เข้าสู่อาณาจักร</button><button class="btn gold" id="dr">👗 แต่งตัวละคร</button></div></div>
<h2>🗺️ แผนที่ 3 ด่าน</h2><div class="map">${ST.map((s,i)=>`<div class="stage ${i<S.unlocked?"":"lock"}" data-i="${i}"><span class="ic">${i<S.unlocked?s.ic:"🔒"}</span><div><b>${s.name}</b><small>${i<S.unlocked?s.d:"ยังไม่ปลดล็อก — ผ่านด่านก่อนหน้า "+ST[i-1].need+" ข้อขึ้นไป"}</small></div></div>`).join("")}</div>`;
$("#go").onclick=()=>{const v=$("#nm").value.trim().slice(0,20);if(!v){toast("✏️ ใส่ชื่อก่อนนะ");$("#nm").focus();return}S.name=v;save();learn()};$("#dr").onclick=()=>{const v=$("#nm").value.trim().slice(0,20);if(v){S.name=v;save()}dress()};
app.querySelectorAll(".stage").forEach(e=>e.onclick=()=>{const i=+e.dataset.i;i<S.unlocked?play(i):toast("🔒 ยังไม่ปลดล็อก")});}

function learn(){clr();
app.innerHTML=hud()+`<h2>🍓 คลังคำศัพท์</h2><p style="text-align:center;margin:0 0 8px">แตะการ์ดเพื่อดูความหมายและฟังเสียง 🔊</p><div class="grid">${W.map((w,i)=>`<div class="ck" data-i="${i}"><div class="zh">${w[0]}</div><div class="py">${w[1]}</div><div class="th">${w[2]}</div><div>🔊</div></div>`).join("")}</div><div class="row"><button class="btn alt" id="h">🏰 กลับอาณาจักร</button><button class="btn gold" id="p">🎮 เริ่มเล่นด่าน 1</button></div>`;
app.querySelectorAll(".ck").forEach(e=>e.onclick=()=>{e.classList.add("open");say(W[+e.dataset.i][0])});
$("#h").onclick=home;$("#p").onclick=()=>play(0);}

function mkQ(st){const qs=shuf(W);while(qs.length<st.n)qs.push(...shuf(W));
return qs.slice(0,st.n).map(w=>{const t=st.type=="mix"?(Math.random()<.5?"zh":"py"):st.type;
const o=shuf([w[2],...shuf(W.filter(x=>x!=w)).slice(0,3).map(x=>x[2])]);return{w,t,o}})}

function play(si){clr();const st=ST[si];
G={si,st,qs:mkQ(st),i:0,score:0,ok:0,total:60,qt:15,paused:false,lock:false};
app.innerHTML=`<div id="hud"></div><div class="run" id="run"><span class="cloud">☁️</span><div class="hills"></div><div class="ground"></div><div class="hero-c" id="hc">${CH(46)}</div></div>
<div class="row" style="margin:0 0 8px"><button class="btn alt" id="ps">⏸️ พัก</button></div><div id="qa"></div>`;
$("#ps").onclick=togglePause;
timers.push(setInterval(tick,1000),setInterval(spawn,2300));
show();}

function hudUp(){$("#hud").innerHTML=`<div class="hud"><span class="pill">⭐ ${G.score}</span><span class="pill">ข้อ ${G.i+1}/${G.st.n}</span><span class="pill">⏱️ รวม ${G.total}s</span><span class="pill">⌛ ${G.qt}s</span></div><div class="bar"><i style="width:${G.i/G.st.n*100}%"></i></div>`}
function show(){const q=G.qs[G.i];G.qt=15;G.lock=false;hudUp();
$("#qa").innerHTML=`<div class="q"><div>${G.st.ic} ${q.t=="zh"?"คำนี้แปลว่าอะไร?":"พินอินนี้แปลว่าอะไร?"}</div>${q.t=="zh"?`<div class="zh">${q.w[0]}</div>`:`<div class="py">${q.w[1]}</div>`}<button class="btn" id="sp" style="margin-top:6px">🔊 ฟังเสียง</button></div><div class="opts">${q.o.map(o=>`<button class="opt">${o}</button>`).join("")}</div>`;
$("#sp").onclick=()=>say(q.w[0]);
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(b,b.textContent==q.w[2]));}

function answer(b,ok){if(G.lock||G.paused)return;G.lock=true;
const q=G.qs[G.i];
if(b){b.classList.add(ok?"ok":"no")}
if(!ok)document.querySelectorAll(".opt").forEach(x=>{if(x.textContent==q.w[2])x.classList.add("ok")});
if(ok){G.score+=G.st.pts;G.ok++;S.coins+=G.st.pts;G.total=Math.min(99,G.total+4);toast("✅ +"+G.st.pts+" และ +4 วินาที")}else toast("❌ เฉลย: "+q.w[2]+" (ตกหลุม -3 วินาที)");
doJump(ok);

hudUp();
setTimeout(()=>{G.i++;G.i>=G.st.n?end():show()},3000);}

function tick(){if(G.paused||G.lock)return;G.total--;G.qt--;
if(G.total<=0){G.total=0;hudUp();return end()}
if(G.qt<=0){answer(null,false)}else hudUp();}

function spawn(){if(G.paused)return;const r=$("#run");if(!r)return;const s=document.createElement("span");s.className="star";s.textContent="⭐";r.appendChild(s);s.onanimationend=()=>s.remove()}
function doJump(ok){const r=$("#run");const p=document.createElement("span");p.className="pit";p.style.animationDuration="1.2s";r.appendChild(p);p.onanimationend=()=>p.remove();
if(ok)jump();else{setTimeout(()=>{const c=$("#hc");if(!c)return;c.classList.add("fall");setTimeout(()=>c.classList.remove("fall"),700)},450);G.total=Math.max(1,G.total-3)}}
function jump(){if(G.paused)return;const hc=$("#hc");hc.classList.add("jump");setTimeout(()=>hc.classList.remove("jump"),900);
const h=hc.getBoundingClientRect();
document.querySelectorAll(".star").forEach(s=>{const r=s.getBoundingClientRect();if(r.left<h.right+50&&r.right>h.left-20){s.remove();G.score+=2;S.coins+=2;toast("🌟 ดาวโบนัส +2");hudUp()}})}
function pit(){if(G.paused)return;const r=$("#run");if(!r)return;const p=document.createElement("span");p.className="pit";r.appendChild(p);p.onanimationend=()=>p.remove()}
function chk(){if(G.paused)return;const hc=$("#hc");if(!hc||hc.classList.contains("jump")||hc.classList.contains("fall"))return;const h=hc.getBoundingClientRect();
document.querySelectorAll(".pit").forEach(p=>{if(p.dataset.hit)return;const r=p.getBoundingClientRect();if(r.left<h.right-12&&r.right>h.left+12){p.dataset.hit=1;hc.classList.add("fall");setTimeout(()=>hc.classList.remove("fall"),700);G.total=Math.max(1,G.total-3);toast("🕳️ ตกหลุม! -3 วินาที");hudUp()}})}
function togglePause(){G.paused=!G.paused;$("#run").classList.toggle("paused",G.paused);$("#ps").textContent=G.paused?"▶️ เล่นต่อ":"⏸️ พัก"}

function end(){clr();const {st,si}=G;const pass=G.ok>=st.need;let msg="";
if(pass&&si+1<ST.length&&S.unlocked<si+2){S.unlocked=si+2;msg=`<p class="pill" style="text-align:center">🔓 ปลดล็อก ${ST[si+1].name}!</p>`}
save();const r=G.ok/st.n,n=r>=.8?3:r>=.5?2:r>0?1:0;
app.innerHTML=hud()+`<div class="hero"><h1>🏆 สรุปผล ${esc(S.name)}</h1><div class="stars">${"⭐".repeat(n)}${"☆".repeat(3-n)}</div><div class="hop">${CH(90)}</div>
<p>ตอบถูก <b>${G.ok}/${st.n}</b> ข้อ · คะแนนรอบนี้ <b>${G.score}</b> · 🪙 สะสม <b>${S.coins}</b></p>${msg}
<p>🎓 ${pass?"เยี่ยมมาก! จำคำศัพท์ได้ดี":"ลองทบทวนในคลังคำศัพท์แล้วเล่นอีกครั้ง"}</p>
<div class="row"><button class="btn big" id="re">🔄 เล่นอีกครั้ง</button><button class="btn alt" id="lr">🍓 ทบทวนคำศัพท์</button><button class="btn gold" id="mp">🗺️ แผนที่</button></div></div>`;
$("#re").onclick=()=>play(si);$("#lr").onclick=learn;$("#mp").onclick=home;}
home();
</script></body></html>
